<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
}

.ad {
  width: 1080px;
  height: 1080px;
  background: linear-gradient(160deg, #0f2444 0%, #1a365d 50%, #2a4a7f 100%);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px;
  overflow: hidden;
}

.ad::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%);
}

.quote-mark {
  font-family: 'Playfair Display', serif;
  font-size: 180px;
  color: rgba(201,168,76,0.25);
  position: absolute;
  top: 80px;
  left: 80px;
  line-height: 1;
  z-index: 1;
}

.stars {
  font-size: 36px;
  color: #c9a84c;
  letter-spacing: 8px;
  margin-bottom: 40px;
  position: relative;
  z-index: 1;
}

.testimonial {
  font-family: 'Playfair Display', serif;
  font-size: 38px;
  color: white;
  text-align: center;
  line-height: 1.5;
  max-width: 820px;
  margin-bottom: 48px;
  position: relative;
  z-index: 1;
  font-style: italic;
}

.author {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 50px;
  position: relative;
  z-index: 1;
}

.author-avatar {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #c9a84c, #b8932f);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #1a365d;
  font-weight: 700;
}

.author-info {
  text-align: left;
}

.author-name {
  font-size: 20px;
  font-weight: 600;
  color: white;
}

.author-location {
  font-size: 15px;
  color: rgba(255,255,255,0.6);
}

.divider {
  width: 80px;
  height: 3px;
  background: #c9a84c;
  margin-bottom: 40px;
  position: relative;
  z-index: 1;
}

.cta-section {
  position: relative;
  z-index: 1;
  text-align: center;
}

.cta-button {
  display: inline-block;
  background: #c9a84c;
  color: #1a365d;
  padding: 22px 56px;
  border-radius: 12px;
  font-size: 22px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 8px 32px rgba(201,168,76,0.4);
  margin-bottom: 16px;
}

.cta-sub {
  font-size: 16px;
  color: rgba(255,255,255,0.6);
}

.logo {
  position: absolute;
  bottom: 50px;
  right: 70px;
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-cross {
  color: #c9a84c;
  font-size: 24px;
}

.feature-strip {
  position: absolute;
  top: 50px;
  right: 70px;
  display: flex;
  gap: 12px;
  z-index: 1;
}

.feature-tag {
  background: rgba(201,168,76,0.15);
  border: 1px solid rgba(201,168,76,0.3);
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  color: #c9a84c;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="ad">
  <div class="quote-mark">"</div>
  
  <div class="feature-strip">
    <div class="feature-tag">📖 365 oraciones</div>
    <div class="feature-tag">🔊 Audio incluido</div>
    <div class="feature-tag">📱 En el celular</div>
  </div>
  
  <div class="stars">★★★★★</div>
  
  <p class="testimonial">"María 365 cambió mi mañana. Antes no sabía qué orar, ahora tengo un momento con María todos los días."</p>
  
  <div class="author">
    <div class="author-avatar">AS</div>
    <div class="author-info">
      <div class="author-name">Ana Sofía</div>
      <div class="author-location">Ciudad de México</div>
    </div>
  </div>
  
  <div class="divider"></div>
  
  <div class="cta-section">
    <div class="cta-button">Quiero esa paz en mi mañana</div>
    <div class="cta-sub">7 días gratis · Después $7.90/mes</div>
  </div>
  
  <div class="logo">
    <span class="logo-cross">✝</span> María 365
  </div>
</div>
</body>
</html>
